const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function mount(a){
 const lc=document.getElementById('lockcss');if(lc)lc.remove();
 const st=document.createElement('style');st.textContent=a.css;document.head.appendChild(st);
 document.body.innerHTML=a.html;
 const sc=document.createElement('script');sc.textContent=a.js;document.body.appendChild(sc);
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
async function open_(raw){
 const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},k,ub(P.c));
 const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
 return JSON.parse(await new Response(ds).text());
}
async function derive(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},base,256);
}
const err=t=>{document.getElementById('err').textContent=t};
(async()=>{
 let saved=null;try{saved=localStorage.getItem('ecm_key')}catch(e){}
 if(saved){try{mount(await open_(ub(saved)));return}catch(e){try{localStorage.removeItem('ecm_key')}catch(_){}}}
 document.getElementById('pasteBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();document.getElementById('pw').value=t.trim();err('')}catch(e){err('Toque no campo e use “Colar”.')}};
 document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();const pw=document.getElementById('pw').value.trim();if(!pw)return;
  const b=document.getElementById('goBtn');b.textContent='Abrindo…';b.disabled=true;err('');
  try{const raw=await derive(pw);const a=await open_(raw);try{localStorage.setItem('ecm_key',bu(raw))}catch(e){}mount(a)}
  catch(e){err('Senha incorreta.');b.textContent='Entrar';b.disabled=false}
 };
})();
</script>
